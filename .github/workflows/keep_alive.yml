name: 24/7 Render Keep-Alive Engine

on:
  schedule:
    # Staggered schedules every 5 minutes to trigger keep-alive runs
    - cron: '*/5 * * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  keep_alive:
    name: Ping Production Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Academy Health & Warm Container
        run: |
          python3 -c "
          import urllib.request, time, sys

          url = 'https://tushar-dodia-academy.onrender.com/api/health'
          print(f'Starting keep-alive probe to {url} at {time.strftime(\"%Y-%m-%d %H:%M:%S UTC\", time.gmtime())}...')

          # Retry up to 3 times with a 90-second timeout to allow cold-booting containers to wake up safely
          for attempt in range(1, 4):
              try:
                  t0 = time.time()
                  req = urllib.request.Request(url, headers={'User-Agent': 'RenderKeepAliveProbe/2.0'})
                  with urllib.request.urlopen(req, timeout=90) as response:
                      elapsed = time.time() - t0
                      status = response.getcode()
                      print(f'Attempt {attempt}: HTTP {status} in {elapsed:.1f}s')
                      if status == 200:
                          print('SUCCESS: Production portal is awake, active, and healthy!')
                          sys.exit(0)
              except Exception as e:
                  print(f'Attempt {attempt} notice: {e}')
                  if attempt < 3:
                      print('Waiting 10s before retry...')
                      time.sleep(10)

          print('Probe completed with warnings.')
          sys.exit(0)
          "
